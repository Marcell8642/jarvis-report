name: Jarvis daily report

on:
  schedule:
    - cron: "35 11 * * *"
    - cron: "35 12 * * *"
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Remember yesterday's numbers
        uses: actions/cache@v4
        with:
          path: state.json
          key: jarvis-state-${{ github.run_id }}
          restore-keys: jarvis-state-

      - name: Keep the voice model between runs
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-voice-v1

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch
          pip install -q -r requirements.txt

      - name: Send the report
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CHANNEL: "@moneymindsettw"
          SEND_NOW: ${{ github.event_name == 'workflow_dispatch' }}
        run: python daily_report.py
